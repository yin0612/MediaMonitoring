name: 部署新聞輿情監測網站

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [scheduled-refresh]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: 簽出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安裝 Python 相依套件
        run: pip install -r requirements.txt

      - name: Python 測試
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: python -m pytest

      - name: 設定 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 安裝 Worker 相依套件
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: cd worker && npm ci

      - name: Worker 核心測試
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: cd worker && npm test

      - name: 執行新聞輿情資料管線
        run: python -m opinion_pipeline.cli --restore-base-url https://yin0612.github.io/MediaMonitoring

      - name: 安裝前端相依套件
        run: cd web && npm ci

      - name: 前端單元測試
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: cd web && npm test

      - name: 型別檢查
        if: github.event_name != 'schedule' && github.event_name != 'repository_dispatch'
        run: cd web && npm run typecheck

      - name: 編譯前端
        run: cd web && npm run build

      - name: 設定 Pages
        uses: actions/configure-pages@v5

      - name: 上傳 Pages 成品
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

      - name: 部署至 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
