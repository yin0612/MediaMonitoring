name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt pip-audit

      - name: Python dependency audit
        run: pip-audit -r requirements.txt

      - name: Python tests
        run: python -m pytest -q
        env:
          PYTHONPATH: src

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"

      - name: Worker install
        working-directory: worker
        run: npm ci

      - name: Worker tests
        working-directory: worker
        run: npm test

      - name: Worker dependency audit
        working-directory: worker
        run: npm audit --audit-level=high

      - name: Frontend install
        working-directory: web
        run: npm ci

      - name: Frontend tests
        working-directory: web
        run: npm test

      - name: Frontend dependency audit
        working-directory: web
        run: npm audit --audit-level=high

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      # CI 只需證明前端建置得起來，不產出正式站產物。若 repository variable
      # VITE_API_BASE_URL 未設定，就以靜態快照模式建置；否則 check:prod-env
      # 會讓 CI 永遠紅燈（部署用的降級邏輯在 refresh-data.yml）。
      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          ALLOW_STATIC_ONLY: ${{ vars.VITE_API_BASE_URL == '' }}
