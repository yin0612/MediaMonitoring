name: CI

on:
  push:
    branches:
      - main

  pull_request:

  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Python tests
        run: python -m pytest -q
        env:
          PYTHONPATH: src

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Worker install
        working-directory: worker
        run: npm ci

      - name: Worker tests
        working-directory: worker
        run: npm test

      - name: Frontend install
        working-directory: web
        run: npm ci

      - name: Frontend tests
        working-directory: web
        run: npm test

      - name: Typecheck
        working-directory: web
        run: npm run typecheck

      # CI 只需證明前端建置得起來，不產出正式站產物。若 repository variable
      # VITE_API_BASE_URL 未設定，就以靜態快照模式建置；否則 check:prod-env
      # 會讓 CI 永遠紅燈（部署用的降級邏輯在 refresh-data.yml）。
      - name: Build
        working-directory: web
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          ALLOW_STATIC_ONLY: ${{ vars.VITE_API_BASE_URL == '' }}
