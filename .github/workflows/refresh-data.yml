name: Refresh data and deploy

on:
  # 程式碼進 main 就重建並部署，否則修好的前端要等下一次排程才會上線，
  # 而 GitHub 的 schedule 事件延遲可達數小時。
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      refresh_id:
        required: false
        type: string

  repository_dispatch:
    types:
      - scheduled-refresh
      - manual-refresh

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: media-monitoring-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # 管線以 exit 2 表示「這一輪沒抓到任何新文章」（來源全掛或全被時間過濾）。
      # 此時 JSON 仍已寫入還原後的最後良好快照，照樣部署比整輪放棄更好；
      # 只有真正的例外（非 0 非 2）才讓工作失敗。
      - name: Refresh news data
        run: |
          set +e
          python -m opinion_pipeline.cli --restore-base-url https://yin0612.github.io/MediaMonitoring
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::warning::本輪沒有取得新文章，將以還原的最後良好快照繼續部署。"
            exit 0
          fi
          exit "$status"
        env:
          PYTHONPATH: src
          PYTHONIOENCODING: utf-8

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install frontend dependencies
        working-directory: web
        run: npm ci

      # Worker 是選配的加速層，不是新聞更新的必要條件。先前這一步在
      # repository variable 未設定時直接 exit 1，導致整條新聞更新管線每次都掛掉、
      # 網站資料停止更新。改為降級建置：沒有 Worker 就走 Pages 靜態快照模式。
      - name: Resolve frontend build mode
        id: build-mode
        run: |
          if [ -n "${VITE_API_BASE_URL}" ]; then
            echo "allow_static_only=false" >> "$GITHUB_OUTPUT"
            echo "Worker API base 已設定，前端將優先讀取即時快照。"
          else
            echo "allow_static_only=true" >> "$GITHUB_OUTPUT"
            echo "::warning::未設定 repository variable VITE_API_BASE_URL，改以 Pages 靜態快照模式建置。新聞仍每 5 分鐘更新，但「立即更新」只能重讀最新快照，無法即時重抓。"
          fi
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}

      - name: Build frontend
        working-directory: web
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          ALLOW_STATIC_ONLY: ${{ steps.build-mode.outputs.allow_static_only }}

      - name: Deploy to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          rm -rf /tmp/media-monitoring-dist
          cp -R web/dist /tmp/media-monitoring-dist

          git checkout --orphan gh-pages-temp
          git rm -rf . > /dev/null
          # git rm 只清掉被追蹤的檔案，連 .gitignore 也一起消失；若不清未追蹤檔，
          # 後面的 git add . 會把 web/node_modules 整包提交進 gh-pages。
          git clean -fdx

          cp -R /tmp/media-monitoring-dist/. .

          echo "${GITHUB_SHA}" > source-main-sha.txt
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" > build-at.txt

          git add .
          git commit -m "Deploy web dist: $(date '+%Y-%m-%d %H:%M:%S')"
          git push origin HEAD:gh-pages --force
