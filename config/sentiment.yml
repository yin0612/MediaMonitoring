# 繁體中文情緒詞典（baseline 方法）
#
# 設計原則：
# - 只做透明、可重算的字面比對；不使用模型權重，符合免費／離線與公開研究限制。
# - 每一次判讀都會回傳「命中詞」作為依據，前端據此顯示正／負向理由，可追溯到原文。
# - weight 2 代表語氣明顯強烈（如死亡、暴漲），weight 1 為一般傾向。
# - 這是 baseline，未經人工標註集驗證前一律標示為實驗性，不得宣稱準確。

negation_window: 4   # 命中詞前幾個字內出現否定詞則反轉極性
negations: [不, 未, 無, 沒, 免, 難以, 並非, 毫無, 拒, 否認]

